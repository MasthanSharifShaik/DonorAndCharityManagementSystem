spring.application.name=DonorAndCharityManagementSystem

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/donor_db}
spring.datasource.username=${DB_USERNAME:donor_user}
spring.datasource.password=${DB_PASSWORD:donor123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=${PORT:8080}

logging.level.org.springframework=INFO
